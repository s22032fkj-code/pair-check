<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>確認完了</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .card {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 40px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #1976d2;
      color: white;
      font-size: 45px;
      line-height: 70px;
    }

    h1 {
      font-size: 24px;
    }

    p {
      color: #555;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="check">✓</div>

  <h1>確認しました！</h1>

  <p>
    ペア情報を確認済みにしました。
  </p>

  <p>
    ご協力ありがとうございます。
  </p>

</div>

</body>
</html>
